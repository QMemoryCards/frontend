name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "24"

jobs:
  quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check:app

      - name: Run tests
        run: npm run test:ci

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    env:
      SYSTEM_TESTS_TOKEN: ${{ secrets.SYSTEM_TESTS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          tags=("${image}:sha-${GITHUB_SHA}")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=("${image}:${GITHUB_REF_NAME}")
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=("${image}:latest")
          fi
          echo "tags=$(IFS=' '; echo "${tags[*]}")" >> "$GITHUB_OUTPUT"
          echo "primary=${tags[0]}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$tag"); done
          docker build "${args[@]}" .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Quick test
        env:
          FRONTEND_IMAGE: ${{ steps.tags.outputs.primary }}
        run: |
          docker run -d --name frontend-smoke -p 8080:80 \
            -e BACKEND_HOST=127.0.0.1 \
            -e BACKEND_PORT=8080 \
            "$FRONTEND_IMAGE"
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs frontend-smoke
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs frontend-smoke

      - name: Remove smoke container
        if: always()
        run: docker rm -f frontend-smoke || true

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for tag in $TAGS; do docker push "$tag"; done

      - name: Trigger system tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SYSTEM_TESTS_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${SYSTEM_TESTS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/QMemoryCards/system-testing/dispatches \
            -d "{\"event_type\":\"images-published\",\"client_payload\":{\"source\":\"frontend\",\"sha\":\"${GITHUB_SHA}\"}}"

      - name: Warn about missing system tests token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SYSTEM_TESTS_TOKEN == ''
        run: echo "::warning::SYSTEM_TESTS_TOKEN is not set; system tests will not run automatically."

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
